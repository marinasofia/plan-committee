# Gitleaks config: the built-in rules plus anything this repo needs.
[extend]
useDefault = true

# Groq keys (the pipeline's tagging provider) start with gsk_ and are not in the default rules.
[[rules]]
id = "plan-committee-groq-api-key"
description = "Groq API key"
regex = '''gsk_[A-Za-z0-9]{20,}'''
keywords = ["gsk_"]

# Allow a known false positive by path, never by disabling a rule:
# [[allowlists]]
# description = "Synthetic fixture with fake card numbers"
# paths = ['''tests/fixtures/fake_cards\.json$''']
