name: Bug report
description: Something is broken or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or browser
      placeholder: iPhone 15, Safari
  - type: markdown
    attributes:
      value: "Never paste your AI key here. If you did, delete it in Google AI Studio or Groq right away."
